# =============================================================
# CAKEBOX - application.properties
# SAFE TO PUSH TO GITHUB — no real passwords!
# =============================================================

server.port=${PORT:8080}

# ── DATABASE ──────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings — important for Render free tier
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000

# ── JPA ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Disable open-in-view to avoid connection exhaustion
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:cakebox-secret-key-default}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── CLOUDINARY ────────────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:placeholder}
cloudinary.api-key=${CLOUDINARY_API_KEY:placeholder}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:placeholder}

# ── RAZORPAY ──────────────────────────────────────────────────
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder}

# ── UPLOAD ────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── LOGGING ───────────────────────────────────────────────────
logging.level.com.cakebox=INFO
logging.level.org.springframework.boot.autoconfigure=INFO
spring.application.name=cakebox-backend